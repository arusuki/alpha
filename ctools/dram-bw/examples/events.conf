# Optional raw perf configuration for CPUs without a built-in backend.
# Each row: PMU CPU KIND CONFIG CONFIG1 CONFIG2 BYTES_PER_COUNT
# CONFIG/CONFIG1/CONFIG2 are hexadecimal, KIND is read/write OR total.
# Supply ALL relevant channels and PMU representative CPUs. Do not mix total
# with read/write. Discover CPUs from /sys/bus/event_source/devices/<PMU>/cpumask.
# CPU is a nonnegative decimal integer. Configs are unsigned 64-bit hex values.
# Duplicate PMU/CPU/CONFIG/CONFIG1/CONFIG2 tuples are rejected, regardless of KIND.
# Lines must be shorter than 1023 bytes, including comments and newline.
# Derive encodings from the exact CPU's PPR and sysfs format files.
# This file intentionally contains no active events; empty config is rejected.
#
# Example only: Rome channel 0 on PMU representative CPU 0 (incomplete coverage):
# amd_df 0 total 0x3807 0x0 0x0 64
# Rome channel 4 event 0x107: high event bits belong at config[32:35]:
# amd_df 0 total 0x100003807 0x0 0x0 64
# Prefer --backend amd-rome: it enumerates all 8 channels and representative CPUs.
