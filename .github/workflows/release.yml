name: Linux CI and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: bash

env:
  # go-sqlite3 requires CGO; disabling it produces an unusable database driver.
  CGO_ENABLED: '1'
  GOFLAGS: -mod=readonly

jobs:
  check:
    name: Test and vet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
      - name: Generate tagged database upgrade window
        run: |
          python3 scripts/test_upgrade_history.py
          go generate ./internal/platform
      - name: Go tests
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: Updater container update and rollback
        run: ALPHA_UPDATER_DOCKER_TEST=1 go test ./internal/updater -run '^TestDockerContainerUpdate$' -count=1 -v
      - name: Frontend tests
        run: |
          for test in tests/test_*.js; do
            node "$test"
          done
      - name: C tool tests (mock backend)
        run: make -C ctools/dram-bw -j2 test

  build:
    name: Build linux/${{ matrix.arch }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Hosted Ubuntu 20.04 runners are retired; compile against its userspace.
    container: ubuntu:20.04
    timeout-minutes: 30
    env:
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
    steps:
      - name: Install Ubuntu 20.04 build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates git binutils tar gzip python3
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.31"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          # Do not reuse CGO build caches produced on newer glibc hosts.
          cache: false
      - name: Configure Git for container builds
        run: |
          # checkout's safe.directory setting uses its temporary HOME. Go invokes
          # Git later under the container HOME, with a host-owned workspace.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --porcelain
      - name: Build and package
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="dev-${GITHUB_SHA:0:12}"
          if [[ "$REF_TYPE" == tag ]]; then
            version="$REF_NAME"
          fi
          # Keep tag names safe for archive paths.
          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "::error::Unsupported version/tag name: $version"
            exit 1
          fi
          history_args=(--write)
          if [[ "$REF_TYPE" == tag ]]; then
            history_args+=(--release-tag "$REF_NAME")
          fi
          python3 scripts/upgrade-history.py "${history_args[@]}"
          package="project-alpha_${version}_linux_${GOARCH}"
          stage="$RUNNER_TEMP/$package"
          mkdir -p "$stage/bin" release
          go build -trimpath -ldflags="-s -w -X project-alpha/internal/buildinfo.Version=$version -X project-alpha/internal/buildinfo.Revision=$GITHUB_SHA" -o "$stage/bin/project-alpha" ./cmd/project-alpha
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$stage/bin/rootless-docker" ./cmd/rootless-docker
          # Offline scratch image contexts need no compiler or image download on workers.
          make -C ctools/dram-bw -j2 BUILD="$RUNNER_TEMP/dram-static" LDFLAGS=-static "$RUNNER_TEMP/dram-static/dram-bwd"
          cp "$RUNNER_TEMP/dram-static/dram-bwd" "$stage/bin/dram-bwd"
          for binary in rootless-docker dram-bwd; do
            if readelf -l "$stage/bin/$binary" | grep -q INTERP; then
              echo "::error::$binary must be static for the node service image"
              exit 1
            fi
          done
          go build -trimpath -ldflags="-s -w -X project-alpha/internal/buildinfo.Version=$version -X project-alpha/internal/buildinfo.Revision=$GITHUB_SHA" -o "$stage/bin/alpha-updater" ./cmd/alpha-updater
          check_glibc() {
            local binary="$1" required
            required="$(readelf --version-info "$binary" | sed -nE 's/.*Name: GLIBC_([0-9.]+).*/\1/p' | sort -V | tail -n1)"
            if [[ -n "$required" && "$(printf '%s\n' "$required" 2.31 | sort -V | tail -n1)" != 2.31 ]]; then
              echo "::error::$binary requires glibc $required (maximum supported: 2.31)"
              exit 1
            fi
          }
          for binary in "$stage"/bin/*; do
            check_glibc "$binary"
          done
          cp README.md "$stage/"
          cp -R docs deploy "$stage/"
          printf 'version=%s\ncommit=%s\nos=linux\narch=%s\ngo=%s\n' \
            "$version" "$GITHUB_SHA" "$GOARCH" "$(go env GOVERSION)" > "$stage/BUILD_INFO"
          tar -C "$RUNNER_TEMP" -czf "release/$package.tar.gz" "$package"
          # Exercise the actual packaged executables on the matching native runner.
          mkdir -p "$RUNNER_TEMP/package-check"
          tar -xzf "release/$package.tar.gz" -C "$RUNNER_TEMP/package-check"
          "$RUNNER_TEMP/package-check/$package/bin/project-alpha" --help
          "$RUNNER_TEMP/package-check/$package/bin/project-alpha" serve --help
          "$RUNNER_TEMP/package-check/$package/bin/project-alpha" share-node --help
          binary_version="$("$RUNNER_TEMP/package-check/$package/bin/project-alpha" --version)"
          [[ "$binary_version" == "project-alpha $version (commit ${GITHUB_SHA:0:12}, "* ]]
          printf '%s\n' "$binary_version"
          "$RUNNER_TEMP/package-check/$package/bin/rootless-docker" --help
          "$RUNNER_TEMP/package-check/$package/bin/dram-bwd" --help
          "$RUNNER_TEMP/package-check/$package/bin/alpha-updater" --help
          updater_version="$("$RUNNER_TEMP/package-check/$package/bin/alpha-updater" --version)"
          [[ "$updater_version" == "alpha-updater $version (commit ${GITHUB_SHA:0:12}, "* ]]
          # Each C tool owns its release layout; keep native builds isolated.
          for tool_dir in ctools/*/; do
            [[ -f "$tool_dir/Makefile" ]] || continue
            tool_name="${tool_dir%/}"
            tool_name="${tool_name##*/}"
            if [[ ! "$tool_name" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
              echo "::error::Unsupported C tool name: $tool_name"
              exit 1
            fi
            tool_package="ctools-${tool_name}_${version}_linux_${GOARCH}"
            make -C "$tool_dir" -j2 release \
              BUILD="$RUNNER_TEMP/ctools-build/$tool_name" \
              RELEASE_DIR="$GITHUB_WORKSPACE/release" RELEASE_NAME="$tool_package"
            tar -xzf "release/$tool_package.tar.gz" -C "$RUNNER_TEMP/package-check"
            tool_check="$RUNNER_TEMP/package-check/$tool_package"
            test -d "$tool_check"
            for binary in "$tool_check"/bin/* "$tool_check"/lib/*.so*; do
              [[ -f "$binary" ]] || continue
              check_glibc "$binary"
            done
            for binary in "$tool_check"/bin/*; do
              [[ -f "$binary" && -x "$binary" ]] || continue
              LD_LIBRARY_PATH="$tool_check/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$binary" --help
            done
          done
          cd release
          for archive in *.tar.gz; do
            sha256sum "$archive" > "$archive.sha256"
            sha256sum --check "$archive.sha256"
          done
      - name: Upload Linux packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: linux-*
          path: release
          merge-multiple: true
      - name: Verify release assets
        working-directory: release
        run: |
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
          done
          sha256sum *.tar.gz > SHA256SUMS
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.tar.gz release/SHA256SUMS --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" release/*.tar.gz release/SHA256SUMS \
              --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
          fi

  cleanup-releases:
    name: Keep the latest 10 releases
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Serialize cleanup across tags without blocking or cancelling publication.
    concurrency:
      group: release-retention
      cancel-in-progress: false
    steps:
      - name: Delete older published releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Fetch all pages before deleting anything. Stable releases and
          # prereleases share the limit; drafts are left untouched.
          release_ids="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
            jq -sr 'add // [] | map(select(.draft == false)) |
              sort_by(.published_at, .id) | reverse | .[10:][] | .id')"
          while IFS= read -r release_id; do
            [[ -n "$release_id" ]] || continue
            echo "Deleting release ID $release_id"
            # Keep Git tags: database upgrade history depends on them.
            gh api --method DELETE "repos/$GH_REPO/releases/$release_id"
          done <<< "$release_ids"
